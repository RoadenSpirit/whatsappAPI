services:
  baileys-sales-api:
    image: node:20-alpine
    container_name: baileys-sales-api
    working_dir: /app
    command: sh -c "npm run build && node lib/server.js"
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - n8n-network

networks:
  n8n-network:
    external: true
    name: n8n-carmay_default
